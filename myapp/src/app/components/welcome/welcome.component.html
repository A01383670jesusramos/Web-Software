<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-image: url('https://media.istockphoto.com/id/592031250/photo/milky-way-and-pink-light-at-mountains-night-colorful-landscape.jpg?s=612x612&w=0&k=20&c=MlBuwRU4M-eZda80ONcdV9NbwtyJQrvggug31A6vLJU=');
            background-size: cover;
            background-position: center;
            color: #fff;
            flex-direction: column;
        }
        h2 {
            text-align: center;
            font-weight: 500;
            margin-bottom: 20px;
            font-size: 35px;
        }
        p {
            font-size: 27.5px;
            text-align: center;
        }
        .btn {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            padding: 10px;
            width: 80%;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn:hover {
            background-color: rgba(255, 255, 255, 0.205);
        }
    </style>
</head>
<body>
    <h2>Login Successful</h2>
    <p>Welcome, admin.</p>
    <button class="btn" (click)="goToMenu()">Ir al Menú</button>

</body>
</html>
