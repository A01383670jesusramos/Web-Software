<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-image: url('https://media.istockphoto.com/id/592031250/photo/milky-way-and-pink-light-at-mountains-night-colorful-landscape.jpg?s=612x612&w=0&k=20&c=MlBuwRU4M-eZda80ONcdV9NbwtyJQrvggug31A6vLJU=');
            background-size: cover;
            background-position: center;
            color: #fff;
            flex-direction: column;
        }
        h2 {
            text-align: center;
            font-weight: 500;
            margin-bottom: 10%;
            width: 80%;
        }
        input {
            width: 80%;
            padding: 10px;
            margin: 12px 0;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
            background: transparent;
            color: #ffffff;
        }
        input::placeholder {
            color: #fff;
            opacity: 1;
        }
        .btn {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            padding: 10px;
            width: 80%;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin: 12px 0;
        }
        .btn:hover {
            background-color: rgba(255, 255, 255, 0.205);
        }
        .btn-small {
            background-color: transparent;
            color: white;
            border: none;
            padding: 5px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: underline;
            width: 80%;
            text-align: center;
            margin: 0;
        }
        .message {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            width: 80%;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Forgot Password</h2>
        <form id="forgotPasswordForm">
            <input type="email" id="email" placeholder="Email" required><br>
            <button type="submit" class="btn">Reset Password</button>
        </form>
        <div class="message">
            <button onclick="window.location.href='app.component.html'" class="btn">Back to Login</button>
        </div>
    </div>
</body>
</html>
