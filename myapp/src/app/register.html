<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-image: url('https://media.istockphoto.com/id/592031250/photo/milky-way-and-pink-light-at-mountains-night-colorful-landscape.jpg?s=612x612&w=0&k=20&c=MlBuwRU4M-eZda80ONcdV9NbwtyJQrvggug31A6vLJU=');
            background-size: cover;
            background-position: center;
            color: #fff;
            flex-direction: column;
        }
        h2 {
            text-align: center;
            font-weight: 500;
            margin-bottom: 10%;
            width: 80%;
        }
        input {
            width: 80%;
            padding: 10px;
            margin: 12px 0;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
            background: transparent;
            color: #ffffff;
        }
        input::placeholder {
            color: #fff;
            opacity: 1;
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1); /* Invierte el color del ícono del calendario (para que sea blanco) */
            cursor: pointer;
        }
        input[type="date"]::-webkit-calendar-picker-indicator:hover {
            opacity: 0.8;
        }
        .btn {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            padding: 10px;
            width: 80%;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin: 12px 0;
        }
        .btn:hover {
            background-color: rgba(255, 255, 255, 0.205);
        }
        .btn-small {
            background-color: transparent;
            color: white;
            border: none;
            padding: 5px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: underline;
            width: 80%;
            text-align: center;
            margin: 0;
        }
        .message {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            width: 80%;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Register</h2>
        <form id="registerForm">
            <input type="text" id="username" placeholder="Username" required><br>
            <input type="text" id="name" placeholder="Full Name" required><br>
            <input type="email" id="email" placeholder="Email" required><br>
            <input type="date" id="dob" placeholder="Date of Birth" required><br>
            <input type="password" id="password" placeholder="Password" required><br>
            <input type="password" id="confirmPassword" placeholder="Confirm Password" required><br>
            <button type="submit" class="btn">Register</button>
        </form>
        <div class="message">
            <button onclick="window.location.href='app.component.html'" class="btn">Back to Login</button>
        </div>
    </div>
</body>

<script>
    const supabaseUrl = 'https://frypddcxlsrjuiergjuu.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZyeXBkZGN4bHNyanVpZXJnanV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDMyMDE1MDcsImV4cCI6MjA1ODc3NzUwN30.sBFRAYKsE1coJTwoD0PLP2E8UsRaL3fWjXsT2oy-liY';
    window.supabase = supabase.createClient(supabaseUrl, supabaseKey);

    document.getElementById("registerForm").addEventListener("submit", async (e) => {
        e.preventDefault();
      
        const username = document.getElementById("username").value;
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
      
        if (password !== confirmPassword) {
          alert("Las contraseñas no coinciden");
          return;
        }
      
        try {
          const { data: authData, error: authError } = await supabase.auth.signUp({
            email,
            password,
            options: {
              data: {
                username,
                full_name: document.getElementById("name").value,
                dob: document.getElementById("dob").value
              }
            }
          });
      
          if (authError) throw authError;
      
          const { error: dbError } = await supabase
            .from("profiles")
            .insert([{
              user_id: authData.user.id,
              username,
              email
            }]);
      
          if (dbError) throw dbError;
      
          alert("¡Registro exitoso! Por favor verifica tu email.");
          window.location.href = "app.component.html";
      
        } catch (error) {
          console.error("Error en registro:", error);
          alert(`Error: ${error.message}`);
        }

        const { data: existingUser } = await supabase
            .from("profiles")
            .select()
            .eq("username", username);

        if (existingUser) {
            alert("Este username ya está en uso");
            return;
        }

      });
</script>


</html>
