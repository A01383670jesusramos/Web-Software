<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-image: url('https://media.istockphoto.com/id/592031250/photo/milky-way-and-pink-light-at-mountains-night-colorful-landscape.jpg?s=612x612&w=0&k=20&c=MlBuwRU4M-eZda80ONcdV9NbwtyJQrvggug31A6vLJU=');
            background-size: cover;
            background-position: center;
            color: #fff;
            flex-direction: column;
        }
        h2 {
            text-align: center;
            font-weight: 500;
            margin-bottom: 10%;
            width: 80%;
        }
        input {
            width: 80%;
            padding: 10px;
            margin: 12px 0;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
            background: transparent;
            color: #ffffff;
        }
        input::placeholder {
            color: #fff;
            opacity: 1;
        }
        .btn {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            padding: 10px;
            width: 80%;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: rgba(255, 255, 255, 0.205);
        }
        .message {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
        }
        .success {
            color: white;
        }
        .error {
            color: white;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required><br>
            <input type="password" id="password" placeholder="Password" required><br>
            <button type="submit" class="btn">Login</button>
        </form>
        <div id="message" class="message"></div>
    </div>

    <script>
        const validUsername = "admin";
        const validPassword = "1234";

        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            if (username === validUsername && password === validPassword) {
                // Guardamos que el usuario está logueado en el localStorage
                localStorage.setItem("loggedIn", true);
                window.location.href = "welcomepage.html"; // Redirigir a la página de bienvenida
            } else {
                messageDiv.textContent = "Error: Invalid Username or Password";
                messageDiv.className = 'message error';
            }
        });
    </script>
</body>
</html>
