<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-image: url('https://media.istockphoto.com/id/592031250/photo/milky-way-and-pink-light-at-mountains-night-colorful-landscape.jpg?s=612x612&w=0&k=20&c=MlBuwRU4M-eZda80ONcdV9NbwtyJQrvggug31A6vLJU=');
            background-size: cover;
            background-position: center;
            color: #fff;
            flex-direction: column;
        }
        h2 {
            text-align: center;
            font-weight: 500;
            margin-bottom: 10%;
            width: 80%;
        }
        input {
            width: 80%;
            padding: 10px;
            margin: 12px 0;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
            background: transparent;
            color: #ffffff;
        }
        input::placeholder {
            color: #fff;
            opacity: 1;
        }
        .btn {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            padding: 10px;
            width: 80%;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin: 12px 0;
        }
        .btn:hover {
            background-color: rgba(255, 255, 255, 0.205);
        }
        .btn-small {
            background-color: transparent;
            color: white;
            border: none;
            padding: 5px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: underline;
            width: 80%;
            text-align: center;
            margin: 0;
        }
        .message {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            width: 80%;
        }
        .success {
            color: white;
        }
        .error {
            color: white;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required><br>
            <input type="password" id="password" placeholder="Password" required><br>
            <button type="submit" class="btn">Login</button>
        </form>
        <div class="message">
            <button onclick="window.location.href='register.html'" class="btn">Create an account</button>
            <button onclick="window.location.href='recovpass.html'" class="btn-small">Forgot Password?</button>
        </div>
        <div id="message" class="message"></div>
    </div>

    <script>
        const supabaseUrl = 'https://frypddcxlsrjuiergjuu.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZyeXBkZGN4bHNyanVpZXJnanV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDMyMDE1MDcsImV4cCI6MjA1ODc3NzUwN30.sBFRAYKsE1coJTwoD0PLP2E8UsRaL3fWjXsT2oy-liY';
        window.supabase = supabase.createClient(supabaseUrl, supabaseKey);

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
          
            // 1. Buscar email asociado al username
            const { data: profile, error: profileError } = await supabase
              .from("profiles")
              .select("email, user_id")
              .eq("username", username)
              .single();
          
            if (profileError || !profile) {
              alert("Usuario no encontrado");
              return;
            }
          
            // 2. Iniciar sesión
            const { data, error } = await supabase.auth.signInWithPassword({
              email: profile.email,
              password: password
            });
          
            if (error) {
              console.error("Detalle del error:", error);
              alert("Error: Credenciales incorrectas o usuario no verificado");
            } else {
              localStorage.setItem("user", JSON.stringify(data.user));
              window.location.href = "welcomepage.html";
            }
          });
    </script>
    
</body>
</html>
