<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('https://media.istockphoto.com/id/592031250/photo/milky-way-and-pink-light-at-mountains-night-colorful-landscape.jpg?s=612x612&w=0&k=20&c=MlBuwRU4M-eZda80ONcdV9NbwtyJQrvggug31A6vLJU=');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        header {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 15px;
            text-align: center;
        }
        header .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header .nav-container a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }
        .menu {
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }
        .menu a {
            margin: 0 20px;
            font-size: 20px;
            color: #333;
            text-decoration: none;
            padding: 10px 20px;
            background-color: #ddd;
            border-radius: 5px;
        }
        .menu a:hover {
            background-color: #bbb;
        }
        .pokemon-info {
            text-align: center;
            margin-top: 20px;
            color: white;
        }
        .pokemon-info img {
            max-width: 100%;
            height: auto;
        }
        .stats {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <div>
                <h1>Menu</h1>
            </div>
            <div>
                <a href="javascript:void(0)" id="loginLogoutButton" onclick="toggleLoginLogout()">Iniciar sesión</a>
            </div>
        </div>
    </header>

    <div class="menu">
        <a href="page1.html">Página 1</a>
        <a href="page2.html">Página 2</a>
        <a href="page3.html" id="protectedPage">Página 3</a>
    </div>

    <!-- Añade un elemento main para mostrar la información del Pokémon -->
    <main></main>

    <script>
        // Verificar si el usuario inició y actualizar el menú
        function updateLoginLogoutButton() {
            const isLoggedIn = localStorage.getItem("loggedIn");
            const loginLogoutButton = document.getElementById("loginLogoutButton");
            const protectedPage = document.getElementById("protectedPage");

            if (isLoggedIn) {
                loginLogoutButton.textContent = "Cerrar sesión";
                // La tercera página solo se entra con sesión iniciada
                protectedPage.style.pointerEvents = "auto";
            } else {
                loginLogoutButton.textContent = "Iniciar sesión";
                protectedPage.style.pointerEvents = "none"; // Desactivar el enlace de la tercera página si el usuario no ha iniciado sesión
            }
        }

        // Función para manejar login/logout
        function toggleLoginLogout() {
            const isLoggedIn = localStorage.getItem("loggedIn");
            if (isLoggedIn) {
                // Cerrar sesión
                localStorage.removeItem("loggedIn");
                window.location.reload();  // Recargar la página para actualizar el menú
            } else {
                // Redirigir a la página de login
                window.location.href = "app.component.html";
            }
        }

        window.onload = function() {
            updateLoginLogoutButton();
            fetchPokemonData(); // Llamar a fetchPokemonData después de que el DOM esté completamente cargado
        };

        function fetchPokemonData() {
            fetch('https://pokeapi.co/api/v2/pokemon/pikachu')
                .then(response => response.json())
                .then(data => {
                    displayPokemonData(data);
                })
                .catch(error => console.error('Error fetching Pokémon data:', error));
        }

        function displayPokemonData(pokemon) {
            const main = document.querySelector('main');
            const pokemonInfo = document.createElement('div');
            pokemonInfo.className = 'pokemon-info';

            const name = document.createElement('h2');
            name.textContent = pokemon.name;

            const image = document.createElement('img');
            image.src = pokemon.sprites.front_default;
            image.alt = pokemon.name;

            const abilities = document.createElement('p');
            abilities.textContent = 'Abilities: ' + pokemon.abilities.map(ability => ability.ability.name).join(', ');

            const statsSection = document.createElement('div');
            statsSection.className = 'stats';
            const statsTitle = document.createElement('h3');
            statsTitle.textContent = 'Stats:';
            statsSection.appendChild(statsTitle);

            pokemon.stats.forEach(stat => {
                const statText = document.createElement('p');
                statText.textContent = `${stat.stat.name}: ${stat.base_stat}`;
                statsSection.appendChild(statText);
            });

            pokemonInfo.appendChild(name);
            pokemonInfo.appendChild(image);
            pokemonInfo.appendChild(abilities);
            pokemonInfo.appendChild(statsSection);

            main.appendChild(pokemonInfo);
        }
    </script>
</body>
</html>
