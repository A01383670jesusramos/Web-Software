<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon List</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="menu.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <div>
                <h1>Pokémon List</h1>
            </div>
            <div>
                <a id="loginLogoutButton" onclick="toggleLoginLogout()">Iniciar sesión</a>
            </div>
        </div>
    </header>

    <!-- Barra de navegación mejorada -->
    <nav class="navbar">
        <a href="page1.html">Página 1</a>
        <a href="page2.html">Página 2</a>
        <a href="page3.html" id="protectedPage">Página 3</a>
    </nav>

    <!-- Contenedor para la lista de Pokémon -->
    <div class="pokemon-list">
        <h2>Lista de Pokémon</h2>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Buscar Pokémon por nombre...">
            <button onclick="searchPokemon()">Buscar</button>
        </div>
        <div id="pokemonContainer"></div>
        <div class="pagination">
            <button id="prevPage">Anterior</button>
            <button id="nextPage">Siguiente</button>
        </div>
    </div>

    <script>
        let currentPage = 0;
        const pokemonPerPage = 5;
        let allPokemon = [];

        function updateLoginLogoutButton() {
            const isLoggedIn = localStorage.getItem("loggedIn");
            const loginLogoutButton = document.getElementById("loginLogoutButton");
            const protectedPage = document.getElementById("protectedPage");

            if (isLoggedIn) {
                loginLogoutButton.textContent = "Cerrar sesión";
                protectedPage.style.opacity = "1";
            } else {
                loginLogoutButton.textContent = "Iniciar sesión";
                protectedPage.style.opacity = "0.6";
            }
        }

        function toggleLoginLogout() {
            const isLoggedIn = localStorage.getItem("loggedIn");
            if (isLoggedIn) {
                localStorage.removeItem("loggedIn");
                window.location.reload();
            } else {
                window.location.href = "app.component.html";
            }
        }

        function fetchPokemonList() {
            fetch('https://pokeapi.co/api/v2/pokemon?limit=30')
                .then(response => response.json())
                .then(data => {
                    allPokemon = data.results;
                    displayPokemonPage(currentPage);
                    updatePaginationButtons();
                })
                .catch(error => console.error('Error fetching Pokémon list:', error));
        }

        function displayPokemonPage(page) {
            const pokemonContainer = document.getElementById("pokemonContainer");
            pokemonContainer.innerHTML = "";

            const start = page * pokemonPerPage;
            const end = start + pokemonPerPage;
            const pokemonToDisplay = allPokemon.slice(start, end);

            pokemonToDisplay.forEach(pokemon => {
                fetch(pokemon.url)
                    .then(response => response.json())
                    .then(data => {
                        const pokemonItem = document.createElement("div");
                        pokemonItem.className = "pokemon-item";

                        const image = document.createElement("img");
                        image.src = data.sprites.front_default;
                        image.alt = data.name;

                        const info = document.createElement("div");

                        const name = document.createElement("h3");
                        name.textContent = data.name;

                        const abilities = document.createElement("p");
                        abilities.textContent = "Habilidades: " + 
                            data.abilities.map(ability => ability.ability.name).join(", ");

                        const stats = document.createElement("div");
                        stats.innerHTML = "<strong>Estadísticas:</strong><br>" +
                            data.stats.map(stat => 
                                `${stat.stat.name}: ${stat.base_stat}`
                            ).join("<br>");

                        info.appendChild(name);
                        info.appendChild(abilities);
                        info.appendChild(stats);

                        pokemonItem.appendChild(image);
                        pokemonItem.appendChild(info);
                        pokemonContainer.appendChild(pokemonItem);
                    });
            });
            updatePaginationButtons();
        }

        function updatePaginationButtons() {
            document.getElementById("prevPage").disabled = currentPage === 0;
            document.getElementById("nextPage").disabled = 
                (currentPage + 1) * pokemonPerPage >= allPokemon.length;
        }

        function changePage(direction) {
            if (direction === "prev" && currentPage > 0) {
                currentPage--;
            } else if (direction === "next" && (currentPage + 1) * pokemonPerPage < allPokemon.length) {
                currentPage++;
            }
            displayPokemonPage(currentPage);
        }

        function searchPokemon() {
            const searchInput = document.getElementById("searchInput").value.toLowerCase().trim();
            if (searchInput) {
                fetch(`https://pokeapi.co/api/v2/pokemon/${searchInput}`)
                    .then(response => {
                        if (!response.ok) throw new Error('Pokémon no encontrado');
                        return response.json();
                    })
                    .then(data => {
                        const pokemonContainer = document.getElementById("pokemonContainer");
                        pokemonContainer.innerHTML = "";

                        const pokemonItem = document.createElement("div");
                        pokemonItem.className = "pokemon-item";

                        const image = document.createElement("img");
                        image.src = data.sprites.front_default;
                        image.alt = data.name;

                        const info = document.createElement("div");

                        const name = document.createElement("h3");
                        name.textContent = data.name;

                        const abilities = document.createElement("p");
                        abilities.textContent = "Habilidades: " + 
                            data.abilities.map(ability => ability.ability.name).join(", ");

                        const stats = document.createElement("div");
                        stats.innerHTML = "<strong>Estadísticas:</strong><br>" +
                            data.stats.map(stat => 
                                `${stat.stat.name}: ${stat.base_stat}`
                            ).join("<br>");

                        info.appendChild(name);
                        info.appendChild(abilities);
                        info.appendChild(stats);

                        pokemonItem.appendChild(image);
                        pokemonItem.appendChild(info);
                        pokemonContainer.appendChild(pokemonItem);
                    })
                    .catch(error => {
                        alert(error.message);
                        console.error('Error:', error);
                    });
            } else {
                displayPokemonPage(currentPage);
            }
        }

        window.onload = function() {
            updateLoginLogoutButton();
            fetchPokemonList();

            document.getElementById("prevPage").addEventListener("click", () => changePage("prev"));
            document.getElementById("nextPage").addEventListener("click", () => changePage("next"));
            
            document.getElementById("searchInput").addEventListener("keypress", (e) => {
                if (e.key === "Enter") searchPokemon();
            });
        };
    </script>
</body>
</html>
